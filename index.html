/* ── RISK ENGINE — exposes, never recommends ───────────────────── */
const STABLES=['USDC','USDT','PYUSD','USDS','DAI','USDE','FDUSD'];
const Risk={
  cfg:()=>Object.assign({maxOpenRiskPct:10,maxTokenPct:20,maxCryptoPct:70,dailyLossPct:Number(S.fin.dailyLoss)||3,requireStop:true,maxCorrelated:3},S.fin.riskCfg||{}),
  book(){
    const rows=[];
    TR.open().forEach(t=>rows.push({k:(t.asset||'?').toUpperCase(),cls:t.cls,chain:t.chain,v:TR.value(t),src:'TRADE'}));
    S.wallets.forEach(w=>{ const c=Capital.cache(w); (c&&c.tokens||[]).filter(Capital.visible).forEach(tk=>rows.push({k:(tk.sym||'?').toUpperCase(),
      cls:STABLES.includes((tk.sym||'').toUpperCase())?'CASH':(tk.mint===WAL.SOL?'CRYPTO':(tk.verified?'CRYPTO':'MEMECOIN')),chain:'SOLANA',v:tk.value,src:'WALLET'})); });
    S.positions.forEach(p=>rows.push({k:(p.asset||'?').toUpperCase(),cls:p.cls==='STABLE'?'CASH':p.cls,chain:'',v:Fin.posValue(p),src:'MANUAL'}));
    return rows;
  },
  compute(){
    const cfg=Risk.cfg(), book=Risk.book(), open=TR.open();
    const total=book.reduce((a,r)=>a+r.v,0);
    const exposure=book.filter(r=>r.cls!=='CASH').reduce((a,r)=>a+r.v,0);
    const byClass={}; book.forEach(r=>byClass[r.cls||'OTHER']=(byClass[r.cls||'OTHER']||0)+r.v);
    const byToken={}; book.filter(r=>r.cls!=='CASH').forEach(r=>byToken[r.k]=(byToken[r.k]||0)+r.v);
    const topTok=Object.entries(byToken).sort((a,b)=>b[1]-a[1])[0]||['—',0];
    const atRisk=open.reduce((a,t)=>a+TR.riskUsd(t),0);
    const noStop=open.filter(t=>!TR.num(t.stop));
    const cap=Number(S.fin.capital)||0;
    const st=TR.stats();
    const todayReal=TR.realizedBetween(today(),today());
    const unreal=open.reduce((a,t)=>a+(TR.unrealized(t)||0),0);
    const cryptoPct=total?((byClass.CRYPTO||0)+(byClass.MEMECOIN||0))/total*100:0;
    const solBeta=book.filter(r=>r.chain==='SOLANA'&&r.cls!=='CASH').reduce((a,r)=>a+r.v,0);
    const clusters={}; open.forEach(t=>{ const k=(t.chain||'—')+' · '+(t.cls||'OTHER'); (clusters[k]=clusters[k]||[]).push(t); });
    const alerts=[];
    if(cap&&atRisk/cap*100>cfg.maxOpenRiskPct) alerts.push({lv:'r',t:`Open risk is ${money(atRisk)} — ${n1(atRisk/cap*100)}% of trading capital, above your ${cfg.maxOpenRiskPct}% limit.`});
    if(total&&topTok[1]/total*100>cfg.maxTokenPct) alerts.push({lv:'a',t:`${esc(topTok[0])} is ${n1(topTok[1]/total*100)}% of the tracked book, above your ${cfg.maxTokenPct}% single-asset limit.`});
    if(cryptoPct>cfg.maxCryptoPct) alerts.push({lv:'a',t:`Crypto + memecoins are ${n1(cryptoPct)}% of the tracked book (limit ${cfg.maxCryptoPct}%).`});
    if(total&&solBeta/total>.5) alerts.push({lv:'a',t:`SOL and Solana tokens make up ${n1(solBeta/total*100)}% of the book — they tend to move together.`});
    Object.entries(clusters).filter(([,v])=>v.length>=cfg.maxCorrelated).forEach(([k,v])=>alerts.push({lv:'a',t:`${v.length} open positions share the same exposure (${esc(k)}): ${v.map(t=>esc(t.asset)).join(', ')}.`}));
    if(cfg.requireStop&&noStop.length) alerts.push({lv:'a',t:`${noStop.length} open position${noStop.length>1?'s have':' has'} no stop — counted as 100% at risk: ${noStop.slice(0,5).map(t=>esc(t.asset)).join(', ')}.`});
    if(cap&&todayReal<0&&Math.abs(todayReal)/cap*100>=cfg.dailyLossPct) alerts.push({lv:'r',t:`Realized loss today is ${money(Math.abs(todayReal))}, past your ${cfg.dailyLossPct}% daily stop.`});
    open.filter(t=>t.liqNow&&TR.value(t)>t.liqNow*.02).forEach(t=>alerts.push({lv:'a',t:`${esc(t.asset)} position is ${n1(TR.value(t)/t.liqNow*100)}% of the pool's liquidity — exits will slip.`}));
    if(!cap) alerts.push({lv:'i',t:'Set trading capital below so risk can be measured as a percentage.'});
    return {cfg,total,exposure,byClass,topTok,atRisk,noStop,cap,st,todayReal,unreal,cryptoPct,solBeta,alerts,book};
  },
};

/* ── MONEY — cash flow, kept separate from trading P&L ──────────── */
const INCOME_SRC=['TRADING','BUSINESS','INVESTMENTS','FREELANCE','FAMILY','OTHER'];
const SPEND_CAT=['FOOD','TRAVEL','SHOPPING','COLLEGE','CARS','ELECTRONICS','SUBSCRIPTIONS','ENTERTAINMENT','BILLS','HEALTH','GIFTS','OTHER'];
const Money={
  inr:e=>(Number(e.amount)||0)*(e.cur==='USD'?FX.rate():1),
  month(m){ const L=S.ledger.filter(e=>monthKey(e.date)===m);
    const inc={},out={},moves=[],type={FIXED:0,VARIABLE:0,DISCRETIONARY:0};
    L.forEach(e=>{ const v=Money.inr(e);
      if(e.kind==='IN') inc[e.cat]=(inc[e.cat]||0)+v;
      else if(e.kind==='OUT'){ out[e.cat]=(out[e.cat]||0)+v; type[e.type||'VARIABLE']+=v; }
      else moves.push(e); });
    const ti=Object.values(inc).reduce((a,b)=>a+b,0), to=Object.values(out).reduce((a,b)=>a+b,0);
    return {inc,out,moves,type,ti,to,net:ti-to,moved:moves.reduce((a,e)=>a+Money.inr(e),0)};
  },
  lastMonths(k){ const out=[]; let d=today().slice(0,8)+'01'; for(let i=0;i<k;i++){ d=addDays(d,-1).slice(0,8)+'01'; out.push(monthKey(d)); } return out; },
  burn(){ const ms=Money.lastMonths(3).map(Money.month); const any=ms.filter(m=>m.to>0);
    const div=Math.max(1,any.length); const t={FIXED:0,VARIABLE:0,DISCRETIONARY:0};
    ms.forEach(m=>Object.keys(t).forEach(k=>t[k]+=m.type[k]));
    Object.keys(t).forEach(k=>t[k]/=div);
    const total=t.FIXED+t.VARIABLE+t.DISCRETIONARY;
    const income=ms.reduce((a,m)=>a+m.ti,0)/div;
    const conc={}; ms.forEach(m=>Object.entries(m.inc).forEach(([k,v])=>conc[k]=(conc[k]||0)+v));
    return {...t,total,income,conc,months:any.length}; },
  runwayMonths(){ const b=Money.burn().total; return b?(Number(S.fin.cashInr)||0)/b:null; },
};

/* ── TAX CENTRE · India — estimates, clearly labelled ──────────── */
const Tax={
  fy(d=today()){ const y=+d.slice(0,4), m=+d.slice(5,7); const s=m>=4?y:y-1; return {s,label:`FY ${s}-${String(s+1).slice(2)}`,from:`${s}-04-01`,to:`${s+1}-03-31`}; },
  bucket(t){
    if(t.cls==='MEMECOIN'||t.cls==='CRYPTO') return 'VDA';
    if(t.cls==='OPTION'||t.cls==='FOREX') return 'BUSINESS';
    if(t.cls==='STOCK'){ const h=TR.holdH(t); if(h!=null&&h<24&&TR.closeDate(t)===(t.opened||'').slice(0,10)) return 'BUSINESS';
      return h!=null&&h>24*365?'LTCG':'STCG'; }
    return 'OTHER';
  },
  compute(fyStart){
    const fy=fyStart!=null?{s:fyStart,label:`FY ${fyStart}-${String(fyStart+1).slice(2)}`,from:`${fyStart}-04-01`,to:`${fyStart+1}-03-31`}:Tax.fy();
    const rate=FX.rate(), slab=(Number(S.fin.slabPct)||30)/100;
    // fully closed trades use total P&L; partially sold open trades contribute only what was realized
    const rows=S.trades.filter(t=>TR.sold(t)>0&&TR.inRange(t,fy.from,fy.to))
      .map(t=>({t,b:Tax.bucket(t),partial:!TR.isClosed(t),inr:(TR.isClosed(t)?TR.pnl(t):TR.realized(t))*rate}));
    const sum=(b,f)=>rows.filter(r=>r.b===b&&f(r.inr)).reduce((a,r)=>a+r.inr,0);
    const vdaGain=sum('VDA',x=>x>0), vdaLoss=sum('VDA',x=>x<0);
    const stcg=Math.max(0,sum('STCG',()=>true)), ltcgRaw=sum('LTCG',()=>true);
    const ltcg=Math.max(0,ltcgRaw-(Math.max(0,-sum('STCG',()=>true))));
    const biz=sum('BUSINESS',()=>true), other=sum('OTHER',()=>true);
    const tax={
      VDA:vdaGain*.30,
      STCG:stcg*.20,
      LTCG:Math.max(0,ltcg-125000)*.125,
      BUSINESS:Math.max(0,biz)*slab,
      OTHER:Math.max(0,other)*slab,
    };
    const base=Object.values(tax).reduce((a,b)=>a+b,0), cess=base*.04, total=base+cess;
    const tds=S.trades.filter(t=>TR.inRange(t,fy.from,fy.to)).reduce((a,t)=>a+(Number(t.tds)||0),0);
    const adv=Number((S.fin.advTax||{})[fy.label])||0;
    return {fy,rate,slab,rows,vdaGain,vdaLoss,stcg,ltcg,ltcgRaw,biz,other,tax,base,cess,total,tds,adv,remaining:total-tds-adv};
  },
  deadlines(fy){ const y=fy.s;
    return [[`${y}-06-15`,'Advance tax · 15% of estimated liability'],[`${y}-09-15`,'Advance tax · 45% cumulative'],
      [`${y}-12-15`,'Advance tax · 75% cumulative'],[`${y+1}-03-15`,'Advance tax · 100% cumulative'],
      [`${y+1}-07-31`,`ITR filing due · ${fy.label} (non-audit)`]]; },
  csv(fy){
    const r=Tax.compute(fy).rows;
    const head=['trade_no','asset','class','tax_bucket','opened','closed','side','size_usd','entry','exit','entry_mcap','exit_mcap','sold_pct','fees_usd','slippage_usd','pnl_usd','usd_inr','pnl_inr','tds_inr','contract','chain','venue'];
    const lines=[head.join(',')].concat(r.map(({t,b,inr:v})=>[t.n,t.asset,t.cls,b,t.opened,t.closed,t.side,t.sizeUsd,t.entry??'',t.exit??'',t.entryMc??'',t.exitMc??'',t.soldPct,t.fees||0,t.slip||0,
      TR.pnl(t).toFixed(2),FX.rate(),v.toFixed(0),t.tds||0,t.contract||'',t.chain||'',t.venue||''].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')));
    return lines.join('\n');
  },
};

const FCAL_KINDS=['TAX','EARNINGS','DIVIDEND','SIP','LOAN','SUBSCRIPTION','UNLOCK','IPO','CORPORATE ACTION','VESTING','OTHER'];
const FCal={
  upcoming(days=120){
    const from=today(), to=addDays(from,days), out=[];
    const fy=Tax.fy(), nfy={s:fy.s+1,label:`FY ${fy.s+1}-${String(fy.s+2).slice(2)}`};
    [...Tax.deadlines(fy),...Tax.deadlines(nfy)].forEach(([d,t])=>{ if(d>=from&&d<=to) out.push({date:d,title:t,kind:'TAX',auto:true}); });
    (S.fevents||[]).forEach(e=>{
      if(e.recur==='MONTHLY'){ let d=e.date; let g=0; while(d<from&&g++<240) d=addMonths(d,1); for(let i=0;i<6&&d<=to;i++){ out.push({...e,date:d}); d=addMonths(d,1); } }
      else if(e.recur==='YEARLY'){ let d=e.date; let g=0; while(d<from&&g++<50) d=addMonths(d,12); if(d<=to) out.push({...e,date:d}); }
      else if(e.date>=from&&e.date<=to) out.push(e);
    });
    S.ledger.filter(l=>l.kind==='OUT'&&l.recur==='MONTHLY').forEach(l=>{ let d=l.date,g=0; while(d<from&&g++<240) d=addMonths(d,1);

    return out.sort((a,b)=>a.date<b.date?-1:1);
  },
};
function addMonths(d,k){ const x=dt(d); const day=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+k);
  const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(day,last)); return iso(x); }

    entry:e,exit:n('tr_exit'),entryMc:em,exitMc:n('tr_xmc'),mark:n('tr_mark'),markMc:n('tr_mmc'),stop:n('tr_stop'),target:n('tr_target'),
    opened:val('tr_open'),closed:sold>=100?(val('tr_close')||new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)):val('tr_close'),
    fees:n('tr_fees')||0,slip:n('tr_slip')||0,txs:n('tr_txs')||1,peak:n('tr_peak'),tds:n('tr_tds')||0,
    liqEntry:n('tr_liqe'),liqExit:n('tr_liqx'),ageH:n('tr_age'),vol24:n('tr_vol'),top10:n('tr_top10'),devPct:n('tr_dev'),holders:n('tr_holders'),organic:n('tr_org'),
    setups:mval('tr_setups'),emotion:val('tr_emo'),mistakes:mval('tr_mist'),why:val('tr_why'),whyExit:val('tr_whyx'),notes:val('tr_notes')};
  const meta=TR.metaCache[data.contract]; if(meta&&meta.icon) data.icon=meta.icon;
  let t;
  if(prev&&!duplicate){ Object.assign(prev,data); t=prev; }
  else { t={id:uid(),n:TR.nextN(),...data,...(duplicate?{soldPct:0,exit:null,exitMc:null,closed:'',shot:false}:{}),shot:false}; S.trades.push(t); }
  if(UI._shotPending&&!duplicate){ try{ await Shots.put(t.id,UI._shotPending); t.shot=true; }catch(err){ toast('SCREENSHOT NOT SAVED','r'); } }
  if(!prev||duplicate){ const d=today(); let c=Engine.checkin(d); if(!c){c={date:d,studied:false,minutes:0,gym:'',trading:'JOURNALED',mood:'',note:''};S.checkins.push(c)} else c.trading=c.trading||'JOURNALED'; }
  saveNow(); closeModal(); refresh(); toast(`TRADE #${t.n} ${duplicate?'DUPLICATED':'SAVED'}`,'s');
};

function pnlHeat(daily,weeks=20){
  const end=today(), cells=[], mx=Math.max(1,...Object.values(daily).map(Math.abs));
  for(let w=0;w<weeks;w++){ let col=''; for(let d=0;d<7;d++){ const date=addDays(end,-((weeks-1-w)*7+(6-d))); const v=daily[date];
    const a=v?clamp(Math.abs(v)/mx,.15,1):0; const c=v>0?'var(--up)':'var(--red)';
    col+=`<i title="${date}${v?' · '+sgn(v):''}" style="width:var(--cell);height:var(--cell);background:${v?`color-mix(in srgb,${c} ${Math.round(a*100)}%,transparent)`:(date>end?'transparent':'var(--panel3)')}"></i>`; }
    cells.push(`<div style="display:grid;grid-template-rows:repeat(7,1fr);gap:3px">${col}</div>`); }
  return `<div class="heatmap" style="display:grid;grid-template-columns:repeat(${weeks},var(--cell));gap:3px">${cells.join('')}</div>`;
}

function answer(q){
  const c=TR.closed(), m0=today().slice(0,8)+'01';
  if(q==='money'){ const mt=c.filter(t=>TR.inRange(t,m0,today())); const g=TR.group('CLASS',mt).sort((a,b)=>b.pnl-a.pnl); const mm=Money.month(monthKey(today()));
    return `<div class="lbl" style="margin-bottom:10px">TRADING · REALIZED THIS MONTH</div>${g.length?g.map(x=>`<div class="row" style="padding:7px 0"><span>${x.k}</span><span class="sp"></span><span class="mono dim" style="font-size:11px">${x.n} TRADES</span><span class="mono ${pnlc(x.pnl)}" style="width:110px;text-align:right">${sgn(x.pnl)}</span></div>`).join(''):'<div class="dim">No trades closed this month.</div>'}
      <div class="lbl" style="margin:16px 0 10px">CASH FLOW · LEDGER</div>${Object.keys(mm.inc).length?Object.entries(mm.inc).map(([k,v])=>`<div class="row" style="padding:7px 0"><span>${k}</span><span class="sp"></span><span class="mono upc">${inr(v)}</span></div>`).join(''):'<div class="dim">No income logged this month.</div>'}
      ${mm.moved?`<div class="lbl" style="margin-top:12px">${inr(mm.moved)} MOVED BETWEEN YOUR OWN ACCOUNTS — NOT INCOME</div>`:''}`; }
  if(q==='strategy'){ const g=TR.group('SETUP').sort((a,b)=>b.exp-a.exp); return breakdownTable(g,'SETUP')+`<div class="lbl" style="margin-top:10px">SORTED BY EXPECTANCY · A TRADE WITH TWO SETUP TAGS COUNTS IN BOTH</div>`; }
  if(q==='habit'){ const m=TR.group('MISTAKE').filter(x=>x.k!=='CLEAN').sort((a,b)=>a.pnl-b.pnl), e=TR.group('EMOTION').sort((a,b)=>a.exp-b.exp);
    return `<div class="lbl" style="margin-bottom:8px">MISTAKES BY TOTAL COST</div>${m.length?breakdownTable(m,'MISTAKE'):'<div class="dim">No mistakes tagged yet.</div>'}<div class="lbl" style="margin:16px 0 8px">EMOTION BY EXPECTANCY</div>${breakdownTable(e,'EMOTION')}`; }
  if(q==='crypto'){ const r=Risk.compute(); return `<div class="num" style="font-size:40px">${n1(r.cryptoPct)}%</div><div class="lbl" style="margin:8px 0 14px">OF THE TRACKED BOOK IS CRYPTO + MEMECOINS · SOL-LINKED ${r.total?n1(r.solBeta/r.total*100):0}%</div>`+
    Object.entries(r.byClass).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="padding:7px 0"><span>${k}</span><span class="sp"></span><span class="mono">${n1(v/r.total*100)}%</span><span class="mono dim" style="width:100px;text-align:right">${money(v)}</span></div>`).join(''); }
  if(q==='big'){ const L=c.filter(t=>TR.pnl(t)>=FV.qN).sort((a,b)=>TR.pnl(b)-TR.pnl(a));
    return `<div class="row" style="gap:8px;margin-bottom:12px"><span class="lbl">PROFIT ≥ $</span><input type="number" class="inp" style="width:120px" value="${FV.qN}" onchange="FV.qN=+this.value||0;FV.q='big';refresh()"></div>`+
      (L.length?L.map(t=>`<div class="tkrow" onclick="UI.tradeModal('${t.id}')">${tIcon(t,28)}<div class="sp"><div class="tkname">#${t.n} ${esc(t.asset)}</div><div class="tksub">${(t.setups||[]).join(', ')} · ${fmtD(TR.closeDate(t))}</div></div><div class="tkval upc">${sgn(TR.pnl(t))}</div></div>`).join(''):`<div class="dim">No closed trades at or above ${money(FV.qN)}.</div>`); }
  if(q==='compare'){ const N=Math.min(100,Math.floor(c.length/2)); if(N<3) return '<div class="dim">Needs at least 6 closed trades to split into two groups.</div>';
    const a=TR.stats(c.slice(-N)), b=TR.stats(c.slice(-2*N,-N));
    const row=(k,x,y,f=v=>v)=>`<tr><td>${k}</td><td class="r">${f(y)}</td><td class="r">${f(x)}</td></tr>`;
    return `<div class="scrollx"><table class="tbl"><thead><tr><th></th><th class="tr">PREVIOUS ${N}</th><th class="tr">LAST ${N}</th></tr></thead><tbody>
      ${row('Win rate',a.wr,b.wr,v=>Math.round(v)+'%')}${row('Expectancy',a.exp,b.exp,sgn)}${row('Total P&L',a.gross,b.gross,sgn)}
      ${row('Avg winner',a.avgW,b.avgW,money)}${row('Avg loser',a.avgL,b.avgL,money)}${row('Profit factor',a.pf,b.pf,v=>v===Infinity?'∞':n2(v))}
      ${row('Max drawdown',a.maxDD,b.maxDD,money)}</tbody></table></div>`; }
  if(q==='dd'){ const s=TR.stats(); if(!s.maxDD) return '<div class="dim">No drawdown yet.</div>';
    const L=c.filter(t=>TR.inRange(t,s.ddFrom||'0000',s.ddTo||'9999'));
    return `<div class="num dnc" style="font-size:34px">−${money(s.maxDD)}</div><div class="lbl" style="margin:8px 0 14px">${fmtDY(s.ddFrom)} → ${fmtDY(s.ddTo)} · ${L.length} TRADES</div>`+
      breakdownTable(TR.group('SETUP',L).sort((a,b)=>a.pnl-b.pnl),'SETUP IN THE DRAWDOWN')+`<div style="margin-top:12px">${breakdownTable(TR.group('EMOTION',L).sort((a,b)=>a.pnl-b.pnl),'EMOTION IN THE DRAWDOWN')}</div>`; }
  return '';
}

    <tbody>${g.map(x=>`<tr><td>${esc(x.k)}</td><td class="r">${x.n}</td><td class="r">${Math.round(x.wr)}%</td><td class="r ${pnlc(x.exp)}">${sgn(x.exp)}</td>

UI.advance=id=>{const p=S.projects.find(x=>x.id===id);const i=STAGES.indexOf(p.stage);

VIEWS_log=()=>{
  const logTabs=subTabs([['','CHECK-INS'],['review','MONTHLY REVIEW']],ROUTE.sub||'','log');
  if(ROUTE.sub==='review') return pageHead('09','LOG','')+logTabs+`<div class="stg">${logReview()}</div>`;
  const st=Engine.streak();
  const weeks=13, cells=[];
  const end=today(); const endDow=dt(end).getDay();
  const startCal=addDays(end,-(weeks*7-1+endDow===0?0:0));
  for(let w=0;w<weeks;w++)for(let dd=0;dd<7;dd++){
    const off=(weeks-1-w)*7+(6-dd);
    cells.push(addDays(end,-off));
  }
  const cin=d=>S.checkins.find(c=>c.date===d);
  const intensity=d=>{const c=cin(d);if(!c)return 0;let s=0;
    if(c.minutes>=60)s=3;else if(c.minutes>=20)s=2;else if(c.studied)s=1;
    if(c.gym==='DONE')s=Math.min(4,s+1); if(c.trading)s=Math.min(4,s+1); return s};
  const list=S.checkins.slice().sort((a,b)=>a.date<b.date?1:-1);
  const mins=S.checkins.reduce((a,c)=>a+(c.minutes||0),0);
  return pageHead('09','LOG',`<button class="btn sm solid" onclick="UI.checkinModal()">CHECK IN</button>`)+logTabs+`
  <div class="g g4" style="margin-bottom:16px">
    ${Tile('CURRENT STREAK',st.n,'CONSECUTIVE DAYS')}
    ${Tile('ATTENDANCE',st.pct,`${st.active} / ${st.span} DAYS`,{dec:0,suffix:'%'})}
    ${Tile('BEST STREAK',st.best,'ALL TIME')}
    ${Tile('HOURS LOGGED',mins/60,'ACADEMIC TIME',{dec:1,suffix:'H'})}
  </div>
  <div class="g gC">
  ${Pnl('ATTENDANCE MAP',`
    <div class="heatmap" style="display:grid;grid-template-columns:repeat(${weeks},var(--cell));gap:3px;justify-content:start">
      ${(()=>{let h='';for(let w=0;w<weeks;w++){h+=`<div style="display:grid;grid-template-rows:repeat(7,1fr);gap:3px">`;
        for(let dd=0;dd<7;dd++){const d=cells[w*7+dd];const i=intensity(d);const fut=d>today();
        h+=`<i title="${d}" onclick="${fut?'':`UI.checkinModal('${d}')`}" style="width:var(--cell);height:var(--cell);cursor:${fut?'default':'pointer'};
          background:${fut?'transparent':['var(--panel3)','var(--h1)','var(--h2)','var(--h3)','var(--h4)'][i]};
          ${d===today()?'outline:1px solid var(--fg);outline-offset:1px':''}"></i>`}
        h+='</div>'}return h})()}
    </div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <span class="lbl">${weeks} WEEKS</span>
      <div class="row" style="gap:4px"><span class="lbl">LESS</span>
        ${[0,1,2,3,4].map(i=>`<i style="width:10px;height:10px;background:${['var(--panel3)','var(--h1)','var(--h2)','var(--h3)','var(--h4)'][i]}"></i>`).join('')}
        <span class="lbl">MORE</span></div>
    </div>`,{tick:true,right:`<span class="lbl">CLICK A DAY TO EDIT</span>`})}
  ${Pnl('RHYTHM',(()=>{
    const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const cnt=[0,0,0,0,0,0,0], tot=[0,0,0,0,0,0,0];
    S.checkins.forEach(c=>{const k=dt(c.date).getDay();if(c.studied||c.minutes)cnt[k]++;tot[k]+=c.minutes||0});
    const mxc=Math.max(...cnt,1);
    const wk=[...Array(8)].map((_,w)=>{let m=0;for(let k=0;k<7;k++){const d=addDays(today(),-((7-w)*7-k));
      const c=S.checkins.find(x=>x.date===d);m+=c?(c.minutes||0):0}return m});
    const mxw=Math.max(...wk,1);
    return `<div class="lbl" style="margin-bottom:12px">WEEKDAY DISTRIBUTION</div>
      ${DOW.map((l,k)=>`<div class="row" style="padding:5px 0">
        <span class="lbl" style="width:34px">${l}</span>
        <div class="sp"><div class="mtr thin"><i style="width:${cnt[k]/mxc*100}%"></i></div></div>
        <span class="mono" style="font-size:10.5px;color:var(--fg3);width:56px;text-align:right">${cnt[k]}D · ${Math.round(tot[k]/60)}H</span>
      </div>`).join('')}
      <div class="lbl" style="margin:20px 0 12px">MINUTES PER WEEK · LAST 8</div>
      <div class="row" style="gap:5px;align-items:flex-end;height:70px">
        ${wk.map(m=>`<div class="sp" style="display:flex;flex-direction:column;justify-content:flex-end;height:100%">
          <div style="height:${clamp(m/mxw*100,3,100)}%;background:${m?'var(--sig)':'var(--panel3)'};box-shadow:${m?'0 0 10px var(--sig3)':'none'};transition:height .8s var(--ease)"></div></div>`).join('')}
      </div>
      <div class="row" style="justify-content:space-between;margin-top:9px">
        <span class="lbl">8 WEEKS AGO</span><span class="lbl">THIS WEEK · ${Math.round(wk[7]/60*10)/10}H</span></div>`;
  })())}
  </div>
  <div style="height:16px"></div>
  ${Pnl('CHECK-IN HISTORY',`<div class="scrollx">${list.length?`<table class="tbl">
    <thead><tr><th>DATE</th><th class="tr">MIN</th><th>GYM</th><th>TRADING</th><th>ENERGY</th><th>NOTE</th><th></th></tr></thead>
    <tbody>${list.map(c=>`<tr>
      <td class="mono" style="font-size:11px">${fmtDY(c.date)}</td>
      <td class="r ${c.minutes?'sig':'dim2'}">${c.minutes||0}</td>
      <td>${c.gym?`<span class="chip ${c.gym==='DONE'?'s':''}">${c.gym}</span>`:'<span class="lbl">—</span>'}</td>
      <td>${c.trading?`<span class="chip b">${c.trading}</span>`:'<span class="lbl">—</span>'}</td>
      <td class="dim" style="font-size:11px">${c.mood||'—'}</td>
      <td class="dim" style="font-size:11.5px;max-width:300px">${esc(c.note||'')}</td>
      <td class="tr"><button class="btn xs ghost" onclick="UI.checkinModal('${c.date}')">EDIT</button></td></tr>`).join('')}
    </tbody></table>`:'<div class="empty">NO CHECK-INS YET</div>'}</div>`,{pad:false})}
`;
};

/* ═════════════════════════════════════════════════════════════════
   Part 9 · GENERATIVE ART
   The Hermes treatment — grayscale plate, screen-blended into the
   field at low opacity. Deterministic from a seed, so a goal or a
   checkpoint always wears the same plate.
   ═════════════════════════════════════════════════════════════════ */
const Art={
  rng(seed){ let a=seed>>>0; return ()=>{a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}; },
  hash(str){ let h=2166136261; for(let i=0;i<String(str).length;i++){h^=String(str).charCodeAt(i);h=Math.imul(h,16777619)} return h>>>0; },
  MOTIFS:['contour','orbit','wave','halftone','lattice','spire'],

  contour(r){ let d='';
    const cx=200+(r()-.5)*90, cy=200+(r()-.5)*90, rings=13+Math.floor(r()*9);
    for(let i=0;i<rings;i++){
      const rad=16+i*(13+r()*5), w=1+r()*.5; let p='';
      for(let a=0;a<=360;a+=7){
        const t=a*Math.PI/180;
        const n=1+Math.sin(t*3+i*.6)*.13+Math.cos(t*5-i*.4)*.08;
        const x=cx+Math.cos(t)*rad*n, y=cy+Math.sin(t)*rad*n*.82;
        p+=(a?'L':'M')+x.toFixed(1)+','+y.toFixed(1);
      }
      d+=`<path d="${p}Z" fill="none" stroke="#fff" stroke-width="${w.toFixed(2)}" opacity="${(.92-i/rings*.62).toFixed(2)}"/>`;
    } return d; },

  orbit(r){ let d='';
    const cx=200,cy=200;
    for(let i=0;i<7;i++){
      const rx=44+i*24+r()*10, ry=rx*(.26+r()*.4), rot=r()*180;
      d+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="none" stroke="#fff"
           stroke-width="${(1.3-i*.11).toFixed(2)}" opacity="${(.85-i*.09).toFixed(2)}" transform="rotate(${rot.toFixed(1)} ${cx} ${cy})"/>`;
      const a=r()*Math.PI*2;
      const px=cx+Math.cos(a)*rx*Math.cos(rot*Math.PI/180)-Math.sin(a)*ry*Math.sin(rot*Math.PI/180);
      const py=cy+Math.cos(a)*rx*Math.sin(rot*Math.PI/180)+Math.sin(a)*ry*Math.cos(rot*Math.PI/180);
      d+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(2+r()*3).toFixed(1)}" fill="#fff" opacity=".9"/>`;
    }
    d+=`<circle cx="${cx}" cy="${cy}" r="${(9+r()*7).toFixed(1)}" fill="#fff" opacity=".95"/>`;
    return d; },

  wave(r){ let d='';
    const f1=.012+r()*.02, f2=.02+r()*.03, amp=16+r()*26;
    for(let i=0;i<26;i++){
      const y0=18+i*15; let p='';
      for(let x=0;x<=400;x+=6){
        const y=y0+Math.sin(x*f1+i*.36)*amp*Math.cos(x*f2-i*.2)*.6;
        p+=(x?'L':'M')+x+','+y.toFixed(1);
      }
      d+=`<path d="${p}" fill="none" stroke="#fff" stroke-width="1" opacity="${(.28+Math.sin(i*.5)*.24+.3).toFixed(2)}"/>`;
    } return d; },

  halftone(r){ let d='';
    const ox=r()*400, oy=r()*400;
    for(let y=14;y<400;y+=17)for(let x=14;x<400;x+=17){
      const dist=Math.hypot(x-ox,y-oy)/300;
      const rad=clamp(7.4*(1-dist)+Math.sin(x*.04+y*.03)*1.5,0,7.4);
      if(rad>.35) d+=`<circle cx="${x}" cy="${y}" r="${rad.toFixed(2)}" fill="#fff" opacity="${clamp(1-dist*.75,.12,1).toFixed(2)}"/>`;
    } return d; },

  lattice(r){ let d='';
    const vx=120+r()*160, vy=150+r()*120;
    for(let i=0;i<=22;i++){
      const t=i/22, x=t*400;
      d+=`<path d="M${x.toFixed(1)},400 L${(vx+(x-vx)*.12).toFixed(1)},${vy.toFixed(1)}" stroke="#fff" stroke-width=".9" opacity="${(.5-Math.abs(t-.5)*.5).toFixed(2)}"/>`;
    }
    for(let i=1;i<=14;i++){
      const y=vy+Math.pow(i/14,2.3)*(400-vy);
      d+=`<path d="M0,${y.toFixed(1)} L400,${y.toFixed(1)}" stroke="#fff" stroke-width=".9" opacity="${(.14+i/14*.55).toFixed(2)}"/>`;
    } return d; },

  spire(r){ let d='';
    const cx=200, cy=210+r()*40, n=58+Math.floor(r()*40);
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2+r()*.04;
      const len=58+Math.abs(Math.sin(i*.42))*118+r()*22;
      d+=`<path d="M${(cx+Math.cos(a)*26).toFixed(1)},${(cy+Math.sin(a)*26).toFixed(1)}
           L${(cx+Math.cos(a)*len).toFixed(1)},${(cy+Math.sin(a)*len).toFixed(1)}"
           stroke="#fff" stroke-width="${(.6+r()*1.1).toFixed(2)}" opacity="${(.24+r()*.62).toFixed(2)}"/>`;
    }
    d+=`<circle cx="${cx}" cy="${cy}" r="25" fill="none" stroke="#fff" stroke-width="1.4" opacity=".9"/>`;
    return d; },

  /* a plate: svg string, grayscale, meant to be screen-blended */
  plate(seed,motif){
    const h=Art.hash(seed), r=Art.rng(h);
    const m=motif||Art.MOTIFS[h%Art.MOTIFS.length];
    const body=(Art[m]||Art.contour)(r);
    return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><radialGradient id="fade${h}" cx="50%" cy="46%" r="62%">
        <stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient><mask id="mk${h}"><rect width="400" height="400" fill="url(#fade${h})"/></mask></defs>
      <g mask="url(#mk${h})">${body}</g></svg>`;
  },
  /* drop-in art block */
  block(seed,motif,cls=''){ return `<div class="art ${cls}">${Art.plate(seed,motif)}</div>`; },
};

/* ═════════════════════════════════════════════════════════════════
   Part 11 · DRILL — practice engine, quiz mode, formula cards
   Wrong answers feed the error log, which feeds weak areas,
   which feeds the re-drill. The loop closes.
   ═════════════════════════════════════════════════════════════════ */
let DR={view:'setup',sub:'ALL',chapter:'ALL',level:'ALL',count:10,
        set:[],i:0,ans:[],t0:0,qt0:0,locked:false,tab:'practice'};
const Drill={
  pool(){ return [...QBANK,...(S.customQ||[])].filter(q=>
    (DR.sub==='ALL'||q.sub===DR.sub) &&
    (DR.chapter==='ALL'||q.chapter===DR.chapter) &&
    (DR.level==='ALL'||q.level===DR.level)); },
  chapters(){ const set=new Set(QBANK.filter(q=>DR.sub==='ALL'||q.sub===DR.sub).map(q=>q.chapter));
    return [...set].sort(); },
  /* weighted pick: chapters with unresolved errors come up more often */
  start(ids){
    let pool = ids ? [...QBANK,...(S.customQ||[])].filter(q=>ids.includes(q.id)) : Drill.pool();
    if(!pool.length){toast('NO QUESTIONS MATCH FILTER','r');return}
    const weak={}; Engine.weakAreas().forEach(w=>weak[w.chapter]=w.n);
    const scored=pool.map(q=>({q,k:Math.random()-Math.min(weak[q.chapter]||0,6)*0.06}));
    scored.sort((a,b)=>a.k-b.k);
    DR.set=scored.slice(0,ids?pool.length:Math.min(DR.count,pool.length)).map(x=>x.q);
    DR.i=0; DR.ans=[]; DR.locked=false; DR.t0=Date.now(); DR.qt0=Date.now(); DR.view='run';
    refresh();
  },
  answer(k){
    if(DR.locked)return;
    const q=DR.set[DR.i];
    DR.ans[DR.i]={qid:q.id,chosen:k,ok:k===q.a,sec:Math.round((Date.now()-DR.qt0)/1000)};
    DR.locked=true; refresh();
  },
  next(){
    if(DR.i<DR.set.length-1){ DR.i++; DR.locked=false; DR.qt0=Date.now(); refresh(); }
    else Drill.finish();
  },
  skip(){ const q=DR.set[DR.i];
    DR.ans[DR.i]={qid:q.id,chosen:-1,ok:false,sec:Math.round((Date.now()-DR.qt0)/1000)};
    DR.locked=true; refresh(); },
  finish(){
    DR.set.forEach((q,k)=>{ const a=DR.ans[k]; if(a) Mock.note(q,a.ok,a.chosen); });
    const correct=DR.ans.filter(a=>a.ok).length;
    const sec=Math.round((Date.now()-DR.t0)/1000);
    S.drill.attempts.unshift({id:uid(),date:today(),sub:DR.sub,level:DR.level,chapter:DR.chapter,
      n:DR.set.length,correct,sec,items:DR.ans.slice()});
    Engine.autoCheckin(); save();
    DR.view='review'; refresh();
    toast('DRILL COMPLETE · '+correct+'/'+DR.set.length,'s');
  },
  bookmark(id){ const b=S.drill.bookmarks;
    const k=b.indexOf(id); if(k>=0)b.splice(k,1); else b.push(id);
    save(); refresh(); },
  /* push the misses straight into the error log */
  pushErrors(){
    let n=0;
    DR.ans.forEach((a,k)=>{ if(a.ok)return;
      const q=DR.set[k];
      S.errors.push({id:uid(),date:today(),subject:q.sub,chapter:q.chapter,
        type:a.chosen===-1?'GUESS':(a.sec>q.t*1.6?'TIME PRESSURE':'CONCEPTUAL'),
        qref:'DRILL · '+q.id,desc:q.q.slice(0,90),resolved:false});
      const it=S.queue.find(i=>i.title===q.chapter);
      if(it)it.errors=S.errors.filter(e=>e.chapter===q.chapter&&!e.resolved).length;
      n++; });
    save(); refresh(); toast(n+' ERROR'+(n===1?'':'S')+' LOGGED','s');
  },
  stats(){
    const a=S.drill.attempts;
    const n=a.reduce((x,y)=>x+y.n,0), c=a.reduce((x,y)=>x+y.correct,0);
    const sec=a.reduce((x,y)=>x+y.sec,0);
    return {runs:a.length,n,c,acc:n?c/n*100:0,avgSec:n?sec/n:0};
  },
  chapterAcc(){
    const m={};
    S.drill.attempts.forEach(at=>at.items.forEach(it=>{
      const q=QBANK.find(x=>x.id===it.qid); if(!q)return;
      m[q.chapter]=m[q.chapter]||{chapter:q.chapter,sub:q.sub,n:0,c:0};
      m[q.chapter].n++; if(it.ok)m[q.chapter].c++;
    }));
    return Object.values(m).map(x=>({...x,acc:x.n?x.c/x.n*100:0})).sort((a,b)=>a.acc-b.acc);
  },
};

const Board={
  MAXW:760, Q:0.62,
  bytes(){ try{ return new Blob([localStorage.getItem(KEY)||'']).size }catch(e){ return 0 } },
  quota(){ return 5*1024*1024; },
  shrink(file){ return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const sc=Math.min(1,Board.MAXW/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',Board.Q)); };
      img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file); }); },
  async addFiles(files){
    let n=0;
    for(const f of files){
      if(!/^image\//.test(f.type))continue;
      if(Board.bytes()>Board.quota()*0.88){ toast('STORAGE NEARLY FULL — REMOVE SOME PINS','r'); break; }
      try{ const src=await Board.shrink(f);
        S.board.unshift({id:uid(),src,caption:'',link:'',added:today()}); n++; }
      catch(e){ toast('COULD NOT READ IMAGE','r'); }
    }
    if(n){ saveNow(); refresh(); toast(n+' PIN'+(n===1?'':'S')+' ADDED','s'); }
  },
  addUrl(u,caption,link){
    u=(u||'').trim(); if(!u){toast('URL REQUIRED','r');return}
    if(!/^https?:\/\//i.test(u)){toast('NEEDS TO BE AN http(s) IMAGE URL','r');return}
    S.board.unshift({id:uid(),src:u,caption:caption||'',link:link||'',added:today()});
    saveNow(); refresh(); toast('PIN ADDED','s');
  },
  remove(id){ S.board=S.board.filter(b=>b.id!==id); saveNow(); refresh(); toast('PIN REMOVED','r'); },
};

/* ── PINTEREST BOARDS ──────────────────────────────────────────────
   Public boards are read from Pinterest's own widget endpoint (the one their
   embed script uses) and drawn in LOCKIN's grid. Latest 50 pins per board.
   pin.it short links can't be resolved from inside a page — the redirect is
   blocked cross-origin — so those need the full pinterest.com address. */
const Pins={
  busy:{},
  STALE:6*3600*1000,
  parse(u){
    u=(u||'').trim();
    if(/(^|\/\/)pin\.it\//i.test(u)) return {short:true};
    const m=u.match(/pinterest\.[a-z.]+\/([^\/?#\s]+)\/([^\/?#\s]+)/i);
    if(!m) return null;
    const user=decodeURIComponent(m[1]), board=decodeURIComponent(m[2]);
    if(['pin','search','ideas','today','_','business','settings'].includes(user.toLowerCase())) return {notBoard:true};
    if(['pins','_saved','_created','boards'].includes(board.toLowerCase())) return {notBoard:true};
    return {user,board};
  },
  add(url,silent){
    const p=Pins.parse(url);
    if(!p){ toast('NOT A PINTEREST BOARD LINK','r'); return false; }
    if(p.short){ toast('SHORT LINK — OPEN IT, THEN PASTE THE PINTEREST.COM ADDRESS','r'); return false; }
    if(p.notBoard){ toast('THAT’S A PIN OR PROFILE — PASTE A BOARD LINK','r'); return false; }
    if(S.boards.some(b=>b.user.toLowerCase()===p.user.toLowerCase()&&b.board.toLowerCase()===p.board.toLowerCase())){
      if(!silent) toast('BOARD ALREADY LINKED','r'); return false; }
    const b={id:uid(),user:p.user,board:p.board,url:`https://www.pinterest.com/${p.user}/${p.board}/`,added:today()};
    S.boards.push(b); CF.boardTab=b.id; save();
    if(!silent){ closeModal(); refresh(); toast('BOARD LINKED','s'); }
    Pins.load(b);
    return true;
  },
  remove(id){ const b=S.boards.find(x=>x.id===id); S.boards=S.boards.filter(x=>x.id!==id);
    if(b) delete S.boardCache[b.id]; CF.boardTab='mine'; save(); refresh(); toast('BOARD REMOVED','r'); },
  async load(b){
    if(Pins.busy[b.id]) return; Pins.busy[b.id]=true;
    const prev=S.boardCache[b.id]||{};
    try{
      const r=await fetch(`https://widgets.pinterest.com/v3/pidgets/boards/${encodeURIComponent(b.user)}/${encodeURIComponent(b.board)}/pins/`);
      const j=await r.json();
      if(j.status!=='success'||!j.data) throw new Error('PRIVATE OR NOT FOUND');
      const pins=(j.data.pins||[]).map(p=>{const im=p.images||{}; const big=im['564x']||im['237x']||im['236x']||{};
        return {id:p.id,src:big.url,w:big.width,h:big.height,desc:(p.description||'').trim(),link:p.link||''};}).filter(p=>p.src);
      const bd=j.data.board||{}, us=j.data.user||{};
      S.boardCache[b.id]={at:Date.now(),pins,name:bd.name||b.board,count:bd.pin_count||pins.length,owner:us.full_name||b.user,err:null};
    }catch(e){
      S.boardCache[b.id]={...prev,err:String(e.message||e)==='Failed to fetch'?'OFFLINE — PINTEREST UNREACHABLE':String(e.message||e),errAt:Date.now()};
    }finally{
      delete Pins.busy[b.id]; saveNow();
      if(ROUTE.view==='goals') refresh();
    }
  },
  loadAll(){ S.boards.forEach(b=>{ const c=S.boardCache[b.id];
    if((!c||!c.at||Date.now()-c.at>Pins.STALE)&&!(c&&c.errAt&&Date.now()-c.errAt<60000)) Pins.load(b); }); },
  keep(boardId,pinId){ const c=S.boardCache[boardId]; const p=c&&c.pins.find(x=>x.id===pinId); if(!p)return;
    if(S.board.some(x=>x.src===p.src)){ toast('ALREADY ON YOUR WALL','r'); return; }
    S.board.unshift({id:uid(),src:p.src,caption:p.desc.slice(0,80),link:`https://www.pinterest.com/pin/${p.id}/`,added:today()});
    saveNow(); refresh(); toast('SAVED TO MY PINS','s'); },
};

 const FILES_DIR=''; 
 const MUSIC_DIR='', MUSIC_SEED=[]; 
const COLLEGE_SEED=()=>({
  meta:{label:'YOUR COLLEGE'},
  courses:[{id:'c1',code:'',short:'MATH-I',name:'Engineering Mathematics I',ltp:'3-1-0',credits:4,books:'',units:[]}],
  labs:[{id:'l1',code:'',short:'PROG LAB',name:'Programming Lab',priority:'HIGH',kind:'code',exps:[]}],
  work:[], bank:[], files:[],
});
const College={
  C:()=>S.college,
  course:id=>S.college.courses.find(c=>c.id===id)||S.college.labs.find(l=>l.id===id),
  lab:id=>S.college.labs.find(l=>l.id===id),
  exp(labId,expId){ const l=College.lab(labId); return l&&l.exps.find(e=>e.id===expId); },
  PRI:{HIGH:0,MED:1,LOW:2},
  done:s=>s==='WRITTEN'||s==='SIGNED',
  performed:e=>!!(e.date&&e.date<=today()),
  /* writing debt: experiments you've performed whose observation or record is still unwritten */
  labDebt(l){ let obs=0,rec=0,unsigned=0;
    l.exps.forEach(e=>{
      if(College.performed(e)||College.done(e.obs)||College.done(e.rec)){
        if(!College.done(e.obs))obs++;
        if(!College.done(e.rec))rec++;
      }
      if(e.obs==='WRITTEN')unsigned++; if(e.rec==='WRITTEN')unsigned++;
    });
    const signed=l.exps.reduce((a,e)=>a+(e.obs==='SIGNED')+(e.rec==='SIGNED'),0);
    return {obs,rec,debt:obs+rec,unsigned,signed,total:l.exps.length*2}; },
  debt(){ return S.college.labs.reduce((a,l)=>a+College.labDebt(l).debt,0); },
  signedPct(){ let s=0,t=0; S.college.labs.forEach(l=>{const d=College.labDebt(l);s+=d.signed;t+=d.total}); return t?s/t*100:0; },
  units(){ let d=0,t=0; S.college.courses.forEach(c=>c.units.forEach(u=>{t++; if(u.status==='DONE'||u.status==='REVISED')d++;})); return {d,t,pct:t?d/t*100:0}; },
  open(){ return S.college.work.filter(w=>w.status==='OPEN').sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1); },
  nextDue(){ return College.open()[0]||null; },
  cycle(labId,expId,field){
    const e=College.exp(labId,expId); if(!e)return;
    const order=['TODO','WRITTEN','SIGNED']; e[field]=order[(order.indexOf(e[field])+1)%3];
    if(e[field]!=='TODO'&&!e.date)e.date=today();
    save(); refresh();
  },
  cycleUnit(cid,n){ const c=S.college.courses.find(x=>x.id===cid); const u=c&&c.units.find(x=>x.n===n); if(!u)return;
    const order=['TODO','STUDYING','DONE','REVISED']; u.status=order[(order.indexOf(u.status)+1)%4]; save(); refresh(); },
  fileHref:name=>'file:///'+FILES_DIR.replace(/\\/g,'/')+encodeURIComponent(name),
  record(labId,expId){
    const l=College.lab(labId), e=College.exp(labId,expId); if(!e)return '';
    const L=l.kind==='code'?['PROGRAM','OUTPUT']:['PROCEDURE','OBSERVATIONS'];
    return [`${l.name.toUpperCase()}`,`Experiment ${e.n}: ${e.title}`,e.date?`Date: ${fmtDY(e.date)}`:'',
      '',`AIM:\n${e.aim||'—'}`,'',`${l.kind==='code'?'SOFTWARE':'APPARATUS / MATERIALS'}:\n${e.apparatus||'—'}`,
      '',`${L[0]}:\n${e.procedure||'—'}`,'',`${L[1]}:\n${e.output||'—'}`,'',`RESULT:\n${e.result||'—'}`]
      .filter((x,i)=>x!==''||i>3).join('\n');
  },
};
function ensureCollege(){
  if(!S.college||!S.college.courses){ S.college=COLLEGE_SEED(); return; }
  const seed=COLLEGE_SEED();
  ['courses','labs','work','bank','files'].forEach(k=>{ if(!Array.isArray(S.college[k]))S.college[k]=seed[k]; });
   
}

function collegeBank(){
  let list=S.college.bank.slice();
  if(CF.course!=='ALL')list=list.filter(b=>b.course===CF.course);
  if(CF.type!=='ALL')list=list.filter(b=>b.type===CF.type);
  if(CF.show==='OPEN')list=list.filter(b=>!b.done); else if(CF.show==='DONE')list=list.filter(b=>b.done); else if(CF.show==='STAR')list=list.filter(b=>b.star);
  const all=S.college.bank, done=all.filter(b=>b.done).length;
  const f=(k,v,l)=>`<button class="${CF[k]===v?'on':''}" onclick="CF.${k}='${v}';refresh()">${l}</button>`;
  const groups={}; list.forEach(b=>{const k=b.course+'§'+b.unit;(groups[k]=groups[k]||[]).push(b)});
  return `
  <div class="g g4" style="margin-bottom:16px">
    ${Tile('QUESTIONS',all.length,'FROM YOUR QUESTION BANKS')}
    ${Tile('ANSWERED',done,'MARKED PREPARED')}
    ${Tile('COVERAGE',all.length?done/all.length*100:0,'OF BANK',{suffix:'%'})}
    ${Tile('STARRED',all.filter(b=>b.star).length,'FOR REVISION')}
  </div>
  <div class="row wf g8" style="margin-bottom:16px">
    <div class="seg-c">${f('course','ALL','ALL')}${[...new Set(all.map(b=>b.course))].map(c=>f('course',c,College.course(c).short)).join('')}</div>
    <div class="seg-c">${f('type','ALL','ANY')}${[...new Set(all.map(b=>b.type))].map(t=>f('type',t,t)).join('')}</div>
    <div class="seg-c">${f('show','OPEN','OPEN')}${f('show','DONE','DONE')}${f('show','STAR','★')}${f('show','ALL','ALL')}</div>
    <span class="sp"></span><button class="btn sm ghost" onclick="UI.bankModal()">+ QUESTION</button>
  </div>
  ${Object.keys(groups).length?Object.entries(groups).map(([k,items])=>{const [cid,u]=k.split('§'); const c=College.course(cid);
    const unit=c&&c.units?c.units.find(x=>x.n===+u):null;
    return Pnl(`${esc(c.short)} · UNIT ${u}${unit?' · '+esc(unit.title.toUpperCase()):''}`,items.map(b=>`
      <div class="row" style="padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start">
        <button class="tbox ${b.done?'on':''}" style="margin-top:2px" onclick="UI.toggleBank('${b.id}','done')">${b.done?icon('check'):''}</button>
        <span class="chip ${b.type==='LAQ'?'a':''}" style="flex:none">${b.type}</span>
        <span class="sp" style="font-size:12.5px;line-height:1.55;${b.done?'color:var(--fg3)':''}">${esc(b.q)}</span>
        <button class="iconbtn" style="width:24px;height:24px;flex:none" onclick="UI.toggleBank('${b.id}','star')">${b.star?'★':'☆'}</button>
      </div>`).join('')+`<div class="lbl" style="margin-top:12px">SOURCE · ${esc(items[0].src||'ADDED BY YOU')}</div>`,{cls:'mb16'})}).join('')
    :Pnl('BANK','<div class="empty">NO QUESTIONS MATCH</div>')}
  <div class="lbl" style="line-height:1.8">M-I LONG-ANSWER QUESTIONS WITH MATRICES AND INTEGRALS ARE OMITTED HERE — THEIR EQUATIONS ARE EMBEDDED OBJECTS THAT DON\u2019T SURVIVE EXTRACTION.<br>OPEN THE PDF IN FILES FOR THOSE.</div>
  <style>.mb16{margin-bottom:16px}</style>`;
}

  const lines=val('wk_q').split('\n').map(x=>x.trim()).filter(Boolean);

UI.savePyq=()=>{
  const item=val('pq_i'), a=Math.round(numv('pq_a')), c=Math.round(numv('pq_c')), m=numv('pq_m');
  if(a<=0){toast('ATTEMPTED REQUIRED','r');return}
  if(c>a||c<0){toast('CORRECT CANNOT EXCEED ATTEMPTED','r');return}
  const it=Engine.byId(item);
  S.pyq.log.unshift({id:uid(),date:today(),item,attempted:a,correct:c,minutes:m,ref:val('pq_r')});
  const miss=a-c;
  if(miss&&val('pq_e')==='YES'){
    for(let k=0;k<miss;k++) S.errors.push({id:uid(),date:today(),subject:it.subject,chapter:it.title,type:val('pq_t'),
      qref:'JEE MAIN PYQ'+(val('pq_r')?' · '+val('pq_r'):''),desc:'',resolved:false});
    it.errors=S.errors.filter(e=>e.chapter===it.title&&!e.resolved).length;
  }
  it.solved=(it.solved||0)+a;
  Engine.autoCheckin(); save(); closeModal(); refresh();
  toast(`${c}/${a} LOGGED${miss&&val('pq_e')==='YES'?' · '+miss+' TO ERROR LOG':''}`,'s');
};

/* ═════════════════════════════════════════════════════════════════
   Part 16 · ATTENDANCE — per period, per course, with a real answer to
   "how many can I still miss". Threshold defaults to 75% with a 65%
   condonation band (the common autonomous-college rule); both editable.
   ═════════════════════════════════════════════════════════════════ */
const DOW=['MON','TUE','WED','THU','FRI','SAT'];
const Att={
  cfg:()=>Object.assign({threshold:75,condonation:65,semStart:'',semEnd:'',aggregate:true},(S.att&&S.att.cfg)||{}),
  courses(){ return [...S.college.courses,...S.college.labs].map(c=>({id:c.id,short:c.short,name:c.name,lab:!!c.exps})); },
  slotsOn(date){ const d=dt(date).getDay(); if(d===0) return []; return (S.att.tt[DOW[d-1]]||[]); },
  isHoliday:date=>(S.att.holidays||[]).includes(date),
  dayLog:date=>(S.att.log[date]||{}),
  /* a mark carries its own subject + periods, so editing the timetable later never rewrites history */
  entry(e,slot){ if(e==null) return null; if(typeof e==='string') return slot?{st:e,cid:slot.cid,periods:Number(slot.periods)||1}:null;
    return {st:e.st,cid:e.cid,periods:Number(e.periods)||1}; },
  stOf:e=>e==null?null:(typeof e==='string'?e:e.st),
  /* counts from the dated log + manual opening balance (for classes before you started logging) */
  stats(cid){
    const base=(S.att.base||{})[cid]||{held:0,present:0};
    let held=Number(base.held)||0, present=Number(base.present)||0;
    Object.entries(S.att.log).forEach(([date,day])=>{ const slots=Att.slotsOn(date);
      Object.entries(day).forEach(([i,e])=>{ const m=Att.entry(e,slots[+i]); if(!m||m.cid!==cid||m.st==='NC') return;
        held+=m.periods; if(m.st==='P') present+=m.periods; }); });
    (S.att.extra||[]).filter(x=>x.cid===cid).forEach(x=>{ const p=Number(x.periods)||1; if(x.st==='NC')return; held+=p; if(x.st==='P')present+=p; });
    return {held,present,pct:held?present/held*100:null};
  },
  aggregate(){ let h=0,p=0; Att.courses().forEach(c=>{const s=Att.stats(c.id);h+=s.held;p+=s.present;}); return {held:h,present:p,pct:h?p/h*100:null}; },
  /* periods still scheduled from tomorrow to semester end, per course */
  remaining(){
    const cfg=Att.cfg(), out={}; if(!cfg.semEnd) return null;
    let d=addDays(today(),1), guard=0;
    while(d<=cfg.semEnd&&guard++<400){ if(!Att.isHoliday(d)) Att.slotsOn(d).forEach(s=>{ out[s.cid]=(out[s.cid]||0)+(Number(s.periods)||1); }); d=addDays(d,1); }
    return out;
  },
  /* the numbers that matter */
  canMissNow:(present,held,t)=>held?Math.max(0,Math.floor(present/t-held)):0,
  needToAttend:(present,held,t)=>{ if(!held||present/held>=t) return 0; return Math.ceil((t*held-present)/(1-t)); },
  semesterBudget(present,held,rem,t){ // periods you can skip across the rest of the semester and still finish ≥ t
    const H=held+rem; if(!H) return null; return Math.floor(present+rem-t*H); },
  mark(date,i,st){ S.att.log[date]=S.att.log[date]||{}; const slot=Att.slotsOn(date)[i]; if(!slot) return;
    if(Att.stOf(S.att.log[date][i])===st) delete S.att.log[date][i]; else S.att.log[date][i]={st,cid:slot.cid,periods:Number(slot.periods)||1};
    if(!Object.keys(S.att.log[date]).length) delete S.att.log[date]; save(); refresh(); },
  markDay(date,st){ const slots=Att.slotsOn(date); if(!slots.length){toast('NO CLASSES ON THIS DAY','r');return}
    S.att.log[date]={}; slots.forEach((sl,i)=>S.att.log[date][i]={st,cid:sl.cid,periods:Number(sl.periods)||1}); save(); refresh(); toast(st==='P'?'ALL PRESENT':st==='A'?'ALL ABSENT':'NO CLASSES','s'); },
  tone(pct,cfg){ if(pct==null) return ''; return pct>=cfg.threshold?'upc':(pct>=cfg.condonation?'amb':'dnc'); },
};
function ensureAtt(){ S.att=S.att||{}; ['tt','log','base'].forEach(k=>{ if(!S.att[k]||typeof S.att[k]!=='object') S.att[k]={}; });
  if(!Array.isArray(S.att.holidays)) S.att.holidays=[]; if(!Array.isArray(S.att.extra)) S.att.extra=[]; if(!S.att.cfg) S.att.cfg={}; }

/* Simple mode — what the college portal shows: days held, days present.
   Opening balance from the portal + one tap per day after that. */
Att.simple=()=>{ const s=S.att.simple; if(!s) return null;
  let held=Number(s.held)||0, present=Number(s.present)||0;
  Object.entries(S.att.days||{}).forEach(([d,v])=>{ if(s.asOf&&d<=s.asOf) return; if(v==='P'){held++;present++;} else if(v==='A') held++; });
  return {held,present,pct:held?present/held*100:null,unit:s.unit||'DAYS'}; };
/* the one number set everything reads: portal days if set, else logged periods */
Att.overall=()=>{ const s=Att.simple(); if(s) return s; const a=Att.aggregate(); return {...a,unit:'PERIODS'}; };
Att.markToday=(d,v)=>{ S.att.days=S.att.days||{};
  if(S.att.simple&&S.att.simple.asOf&&d<=S.att.simple.asOf){ toast('ALREADY INCLUDED IN YOUR PORTAL NUMBERS — UPDATE THEM INSTEAD','r'); return; }
  if(S.att.days[d]===v) delete S.att.days[d]; else S.att.days[d]=v; save(); refresh();
  if(S.att.days[d]) toast(v==='P'?'MARKED PRESENT':v==='A'?'MARKED ABSENT':'MARKED HOLIDAY','s'); };
Att.cycleDay=d=>{ if(d>today()) return; const cur=(S.att.days||{})[d], nx={undefined:'P',P:'A',A:'H',H:undefined}[cur];
  if(S.att.simple&&S.att.simple.asOf&&d<=S.att.simple.asOf){ toast('BEFORE YOUR LAST PORTAL UPDATE — ALREADY COUNTED','r'); return; }
  S.att.days=S.att.days||{}; if(nx) S.att.days[d]=nx; else delete S.att.days[d]; save(); refresh(); };

/* ═════════════════════════════════════════════════════════════════
   Part 17 · MONTHLY REVIEW — every system on one page, one month at a
   time, compared with the month before. Numbers first; your reflection
   underneath, saved per month.
   ═════════════════════════════════════════════════════════════════ */
const Review={
  bounds:m=>{ const from=m+'-01'; const last=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(); return {from,to:m+'-'+String(last).padStart(2,'0'),days:last}; },
  prev:m=>{ const d=dt(m+'-01'); d.setMonth(d.getMonth()-1); return iso(d).slice(0,7); },
  inM:(date,b)=>!!date&&String(date).slice(0,10)>=b.from&&String(date).slice(0,10)<=b.to,
  metrics(m){
    const b=Review.bounds(m), inM=d=>Review.inM(d,b);
    const ci=S.checkins.filter(c=>inM(c.date));
    const active=ci.filter(c=>c.studied||c.gym||c.trading||c.minutes>0).length;
    const minutes=ci.reduce((a,c)=>a+(Number(c.minutes)||0),0);
    const cleared=S.queue.filter(i=>i.counts&&Engine.isDone(i)&&inM(i.done)).length;
    const drills=S.drill.attempts.filter(a=>inM(a.date)); const dn=drills.reduce((a,x)=>a+x.n,0), dc=drills.reduce((a,x)=>a+x.correct,0);
    const mocks=(S.mocks||[]).filter(x=>inM(x.date));
    const pyq=(S.pyq&&S.pyq.log||[]).filter(l=>inM(l.date)); const pa=pyq.reduce((a,l)=>a+l.attempted,0), pc=pyq.reduce((a,l)=>a+l.correct,0);
    const closed=TR.closed().filter(t=>inM(TR.closeDate(t))); const st=TR.stats(closed);
    const mist=TR.group('MISTAKE',closed).filter(x=>x.k!=='CLEAN').sort((a,c)=>a.pnl-c.pnl)[0];
    const setup=TR.group('SETUP',closed).filter(x=>x.k!=='UNTAGGED').sort((a,c)=>c.pnl-a.pnl)[0];
    const money=Money.month(m);
    const gym=ci.filter(c=>c.gym==='DONE').length;
    const posture=Object.keys(S.body.posture||{}).filter(d=>inM(d)&&(S.body.posture[d]||[]).length>=3).length;
    const diet=Object.entries(S.body.diet||{}).filter(([d,v])=>inM(d)&&v&&v.protein); const protein=diet.length?diet.reduce((a,[,v])=>a+(+v.protein||0),0)/diet.length:null;
    const habitDays=Math.min(b.days,dayDiff(b.from,today())+1);
    const habits=S.habits.map(h=>{ let hit=0; for(let k=0;k<Math.max(0,habitDays);k++) if(Habits.hit(h,addDays(b.from,k))) hit++;
      const expected=Math.max(1,Math.max(0,habitDays)*((h.freqNum||1)/(h.freqDen||1))); return {name:h.name,hit,rate:clamp(hit/expected*100,0,100)}; });
    const habitAvg=habits.length?habits.reduce((a,h)=>a+h.rate,0)/habits.length:null;
    let attH=0,attP=0; if(S.att&&S.att.log){ Object.entries(S.att.log).forEach(([d,day])=>{ if(!inM(d)) return; const slots=Att.slotsOn(d);
      Object.entries(day).forEach(([i,e])=>{ const x=Att.entry(e,slots[+i]); if(!x||x.st==='NC') return; attH+=x.periods; if(x.st==='P') attP+=x.periods; }); }); }
    const labs=S.college?S.college.labs.reduce((a,l)=>a+l.exps.filter(e=>inM(e.date)).length,0):0;
    const tasks=S.tasks.filter(t=>t.done&&inM(t.doneAt)).length;
    return {m,b,active,minutes,cleared,drillN:dn,drillAcc:dn?dc/dn*100:null,mocks:mocks.length,mockBest:mocks.length?Math.max(...mocks.map(x=>x.total)):null,
      mockAvg:mocks.length?mocks.reduce((a,x)=>a+x.total,0)/mocks.length:null,pyqN:pa,pyqAcc:pa?pc/pa*100:null,
      trades:st.n,pnl:st.gross,wr:st.n?st.wr:null,best:st.n?st.best:null,worst:st.n?st.worst:null,mist,setup,
      income:money.ti,outflow:money.to,gym,posture,protein,habits,habitAvg,att:attH?attP/attH*100:null,attH,labs,tasks};
  },
  /* biggest moves vs last month, only where both months have data */
  moves(a,p){
    const defs=[['Study time',a.minutes,p.minutes,v=>n1(v/60)+'h'],['Days active',a.active,p.active,v=>v],['Queue items cleared',a.cleared,p.cleared,v=>v],
      ['Drill accuracy',a.drillAcc,p.drillAcc,v=>Math.round(v)+'%'],['PYQs solved',a.pyqN,p.pyqN,v=>v],['Best mock',a.mockBest,p.mockBest,v=>v],
      ['Trading P&L',a.pnl,p.pnl,sgn],['Win rate',a.wr,p.wr,v=>Math.round(v)+'%'],['Gym sessions',a.gym,p.gym,v=>v],
      ['Habit hit rate',a.habitAvg,p.habitAvg,v=>Math.round(v)+'%'],['Attendance',a.att,p.att,v=>n1(v)+'%'],['Spending',a.outflow,p.outflow,inr]];
    return defs.filter(([,x,y])=>x!=null&&y!=null&&(x||y)).map(([k,x,y,f])=>{
      const good=k==='Spending'?x<=y:x>=y; const pc=y?((x-y)/Math.abs(y))*100:(x?100:0);
      return {k,x,y,f,good,pc,mag:Math.abs(pc)}; }).sort((a,c)=>c.mag-a.mag);
  },
  text(r,p,note){
    const L=[`LOCK-IN OS · MONTHLY REVIEW · ${new Date(r.m+'-01T00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}`,'',
      `Study: ${n1(r.minutes/60)}h across ${r.active} active days · ${r.cleared} queue items cleared`,
      `Practice: ${r.drillN} drill Qs${r.drillAcc!=null?' at '+Math.round(r.drillAcc)+'%':''} · ${r.pyqN} PYQs${r.pyqAcc!=null?' at '+Math.round(r.pyqAcc)+'%':''} · ${r.mocks} mocks${r.mockBest!=null?' (best '+r.mockBest+')':''}`,
      `Trading: ${r.trades} closed · ${sgn(r.pnl)}${r.wr!=null?' · '+Math.round(r.wr)+'% win rate':''}`,
      `Money: in ${inr(r.income)} · out ${inr(r.outflow)}`,
      `Body: ${r.gym} gym sessions · ${r.posture} posture days${r.protein!=null?' · '+Math.round(r.protein)+'g protein avg':''}`,
      `College: ${r.att!=null?n1(r.att)+'% attendance · ':''}${r.labs} lab experiments · ${r.tasks} tasks done`,''];
    Review.moves(r,p).slice(0,6).forEach(x=>L.push(`${x.good?'▲':'▼'} ${x.k}: ${x.f(x.y)} → ${x.f(x.x)}`));
    if(note){ L.push(''); if(note.wins) L.push('WINS: '+note.wins); if(note.lessons) L.push('LESSONS: '+note.lessons); if(note.focus) L.push('NEXT MONTH: '+note.focus); }
    return L.join('\n');
  },
};
function logReview(){

  const months=[]; { let x=cur; for(let i=0;i<12;i++){ months.push(x); x=Review.prev(x); } }

  const delta=(x,y,fmt,inv)=>{ if(x==null||y==null) return ''; const d=x-y; if(!d) return 'SAME AS LAST MONTH'; return `<span class="${(inv?d<0:d>0)?'upc':'dnc'}">${d>0?'▲':'▼'} ${fmt(Math.abs(d))}</span> VS LAST`; };
  return `
  <div class="row wf g8" style="margin-bottom:16px">
    <select class="inp" style="width:auto" onchange="CF.revM=this.value;refresh()">${months.map(x=>`<option value="${x}" ${x===m?'selected':''}>${new Date(x+'-01T00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</option>`).join('')}</select>
    ${m===cur?'<span class="chip a">IN PROGRESS</span>':''}
    <span class="sp"></span>
    <button class="btn sm ghost" onclick="navigator.clipboard.writeText(Review.text(Review.metrics('${m}'),Review.metrics(Review.prev('${m}')),(S.reviews||{})['${m}'])).then(()=>toast('REVIEW COPIED','s'),()=>toast('CLIPBOARD BLOCKED','r'))">COPY AS TEXT</button>

const GEN={
  r:Math.random,
  int(a,b){ return a+Math.floor(GEN.r()*(b-a+1)); },
  pick(a){ return a[Math.floor(GEN.r()*a.length)]; },
  shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(GEN.r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; },
  f(v){ if(!isFinite(v)) return '∞'; const r=Math.round(v); if(Math.abs(v-r)<1e-9) return String(r); return String(+v.toFixed(Math.abs(v)<1?3:2)); },
  gcd:(a,b)=>b?GEN.gcd(b,a%b):Math.abs(a),
  frac(n,d){ if(d<0){n=-n;d=-d;} const g=GEN.gcd(n,d)||1; n/=g; d/=g; return d===1?String(n):`${n}/${d}`; },
  /* numeric options: correct first, then traps; unique; shuffled */
  num(ans,traps,unit=''){
    const out=[], seen=new Set(), push=v=>{ if(v==null||!isFinite(v)) return; const s=GEN.f(v)+(unit?' '+unit:''); if(!seen.has(s)){seen.add(s);out.push(s);} };
    push(ans); traps.forEach(push); let k=1; while(out.length<4&&k<40){ push(ans*(1+(k%2?1:-1)*0.1*Math.ceil(k/2))+(ans===0?k:0)); k++; }
    return GEN.pack(out);
  },
  str(ans,traps){ const out=[ans]; traps.forEach(t=>{ if(!out.includes(t)) out.push(t); }); return GEN.pack(out.slice(0,4)); },
  pack(list){ const correct=list[0]; const o=GEN.shuf(list.slice(0,4)); return {opts:o,a:o.indexOf(correct)}; },
  sup(n){ return String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]||(c==='-'?'⁻':c)).join(''); },
};

const MOCK_FORMATS={
  FULL:{label:'FULL MOCK',min:180,sec:{PHY:30,CHM:30,ENG:10,LR:20,MAT:40},bonus:true},
  HALF:{label:'HALF MOCK',min:90,sec:{PHY:15,CHM:15,ENG:5,LR:10,MAT:20},bonus:false},
  QUICK:{label:'QUICK 30',min:42,sec:{PHY:7,CHM:7,ENG:2,LR:5,MAT:9},bonus:false},
  PHY:{label:'PHYSICS SECTIONAL',min:42,sec:{PHY:30},bonus:false},
  CHM:{label:'CHEMISTRY SECTIONAL',min:42,sec:{CHM:30},bonus:false},
  MAT:{label:'MATHS SECTIONAL',min:55,sec:{MAT:40},bonus:false},
  ELR:{label:'ENGLISH + LR',min:42,sec:{ENG:10,LR:20},bonus:false},
};
const SECNAME={PHY:'PHYSICS',CHM:'CHEMISTRY',ENG:'ENGLISH',LR:'LOGICAL REASONING',MAT:'MATHEMATICS'};

const Mock={
  stat:id=>(S.qstats[id]||{seen:0,right:0,wrong:0,last:0}),
  note(q,ok,chosen){ if(q.gen) return; const s=S.qstats[q.id]=S.qstats[q.id]||{seen:0,right:0,wrong:0,last:0};
    s.seen++; if(chosen>=0){ if(ok)s.right++; else s.wrong++; } s.last=Date.now(); },
  pool(sub,scope){
    let p=[...QBANK,...(S.customQ||[])].filter(q=>q.sub===sub);
    if(scope==='CLEARED'){ const ok=new Set(S.queue.filter(i=>Engine.isDone(i)||i.status==='IN_PROGRESS').map(i=>i.title)); p=p.filter(q=>ok.has(q.chapter)); }
    return p;
  },
  priority(q){ const s=Mock.stat(q.id); if(!s.seen) return 3+Math.random(); if(s.wrong>s.right) return 2+Math.random(); return Math.random()*(Date.now()-s.last>14*864e5?1.5:.8); },
  genFor(sub,scope){ let g=GENS.filter(x=>x.sub===sub);
    if(scope==='CLEARED'){ const ok=new Set(S.queue.filter(i=>Engine.isDone(i)||i.status==='IN_PROGRESS').map(i=>i.title)); const f=g.filter(x=>ok.has(x.ch)); if(f.length) g=f; }
    return g; },
  build(fmtKey,scope){
    const F2=MOCK_FORMATS[fmtKey], qs=[];
    Object.entries(F2.sec).forEach(([sub,need])=>{
      const bank=Mock.pool(sub,scope).map(q=>({q,p:Mock.priority(q)})).sort((a,b)=>b.p-a.p);
      const gens=Mock.genFor(sub,scope);
      const genShare=gens.length?(sub==='LR'?0.6:sub==='ENG'?0:0.5):0;
      let fromGen=Math.round(need*genShare);
      const freshBank=bank.filter(x=>x.p>=2).length;
      if(need-fromGen>freshBank&&gens.length) fromGen=Math.min(need,need-freshBank);   // bank running dry → lean on generators
      const picked=[];
      bank.slice(0,Math.min(need-fromGen,bank.length)).forEach(x=>picked.push({...x.q,src:x.q.id.startsWith('u')?'IMPORT':'BANK'}));
      const use={}; let guard=0;
      while(picked.length<need&&gens.length&&guard++<need*20){
        const g=GEN.pick(gens); if((use[g.id]||0)>=Math.max(2,Math.ceil(need/gens.length)+1)) continue;
        use[g.id]=(use[g.id]||0)+1;
        try{ const x=g.make(); if(!x||!x.opts||x.opts.length<4||x.a<0) continue;
          picked.push({id:'g:'+g.id+':'+uid(),gen:g.id,sub,chapter:g.ch,level:g.lv,t:g.t,q:x.q,opts:x.opts,a:x.a,sol:x.sol,src:'GENERATED'}); }catch(e){}
      }
      // still short (e.g. English): recycle least-recently-seen bank questions
      if(picked.length<need){ const have=new Set(picked.map(p=>p.id));
        bank.filter(x=>!have.has(x.q.id)).sort((a,b)=>Mock.stat(a.q.id).last-Mock.stat(b.q.id).last).slice(0,need-picked.length).forEach(x=>picked.push({...x.q,src:'BANK'})); }
      GEN.shuf(picked).forEach(p=>qs.push({...p,sec:sub}));
    });
    // "cleared chapters only" can't fill a section early on — top it up from the full syllabus
    if(scope==='CLEARED'){ const have=new Set(qs.map(q=>q.id)); let topped=0;
      Object.entries(F2.sec).forEach(([sub,need])=>{ let gap=need-qs.filter(q=>q.sec===sub).length; if(gap<=0) return;
        Mock.build(fmtKey,'ALL').filter(q=>q.sec===sub&&!have.has(q.id)).slice(0,gap).forEach(q=>{ qs.push(q); have.add(q.id); topped++; }); });
      if(topped) Mock.lastTopUp=topped; }
    return qs;
  },
  bonusSet(){ const out=[]; ['PHY','CHM','MAT'].forEach(sub=>{ const gens=Mock.genFor(sub,'ALL');
    for(let i=0;i<4;i++){ const g=GEN.pick(gens), x=g.make(); out.push({id:'g:'+g.id+':'+uid(),gen:g.id,sub,chapter:g.ch,level:g.lv,t:g.t,q:x.q,opts:x.opts,a:x.a,sol:x.sol,src:'GENERATED',sec:sub,bonus:true}); } });
    return out; },
  start(fmtKey,scope){
    if(S.examRun&&!confirm('A mock is already in progress. Discard it and start a new one?')) return;
    Mock.lastTopUp=0;
    const qs=Mock.build(fmtKey,scope), F2=MOCK_FORMATS[fmtKey];
    if(Mock.lastTopUp) toast(Mock.lastTopUp+' QUESTIONS FROM OUTSIDE YOUR CLEARED CHAPTERS — NOT ENOUGH CLEARED YET','r');
    const fresh=qs.filter(q=>q.gen||!Mock.stat(q.id).seen).length;
    S.examRun={id:uid(),fmt:fmtKey,scope,startedAt:Date.now(),endsAt:Date.now()+F2.min*60000,qs,ans:{},marked:{},visited:{0:1},spent:{},cur:0,lastSwitch:Date.now(),bonus:false,locked:0,fresh};
    saveNow(); go('bitsat/exam');
  },
  run:()=>S.examRun,
  left(){ const r=S.examRun; return r?Math.max(0,Math.round((r.endsAt-Date.now())/1000)):0; },
  track(){ const r=S.examRun; if(!r) return; const now=Date.now(); r.spent[r.cur]=(r.spent[r.cur]||0)+(now-r.lastSwitch)/1000; r.lastSwitch=now; },
  go(i){ const r=S.examRun; if(!r||i<0||i>=r.qs.length) return; if(i<r.locked){ toast('SUBMITTED BEFORE BONUS — LOCKED','r'); return; }
    Mock.track(); r.cur=i; r.visited[i]=1; save(); Mock.paint(); },
  answer(k){ const r=S.examRun; if(r.cur<r.locked) return; if(r.ans[r.cur]===k) delete r.ans[r.cur]; else r.ans[r.cur]=k; save(); Mock.paint(); },
  mark(){ const r=S.examRun; r.marked[r.cur]=!r.marked[r.cur]; if(!r.marked[r.cur]) delete r.marked[r.cur]; Mock.next(); },
  clear(){ const r=S.examRun; delete r.ans[r.cur]; save(); Mock.paint(); },
  next(){ const r=S.examRun; if(r.cur<r.qs.length-1) Mock.go(r.cur+1); else { save(); Mock.paint(); } },
  canBonus(){ const r=S.examRun; const F2=MOCK_FORMATS[r.fmt]; return F2.bonus&&!r.bonus&&Object.keys(r.ans).length===r.qs.length&&Mock.left()>60; },
  takeBonus(){ const r=S.examRun; if(!Mock.canBonus()) return;
    if(!confirm('Take the 12 bonus questions? Your 130 answers lock and cannot be changed.')) return;
    Mock.track(); r.locked=r.qs.length; r.qs=r.qs.concat(Mock.bonusSet()); r.bonus=true; r.cur=r.locked; r.visited[r.cur]=1; saveNow(); Mock.paint(); },
  submit(auto){
    const r=S.examRun; if(!r) return;
    if(!auto&&!confirm(`Submit? ${r.qs.length-Object.keys(r.ans).length} unanswered.`)) return;
    Mock.track();
    const items=r.qs.map((q,i)=>{ const ch=r.ans[i]; const ok=ch!==undefined&&ch===q.a; Mock.note(q,ok,ch===undefined?-1:ch);
      return {q,ch:ch===undefined?-1:ch,ok,sec:q.sec,t:Math.round(r.spent[i]||0),marked:!!r.marked[i],bonus:!!q.bonus}; });
    const sec={}; items.forEach(it=>{ const s=sec[it.sec]=sec[it.sec]||{n:0,att:0,right:0,wrong:0,score:0,time:0};
      s.n++; s.time+=it.t; if(it.ch>=0){ s.att++; if(it.ok){s.right++;s.score+=3;} else {s.wrong++;s.score-=1;} } });
    const total=Object.values(sec).reduce((a,s)=>a+s.score,0), att=items.filter(x=>x.ch>=0).length, right=items.filter(x=>x.ok).length;
    const F2=MOCK_FORMATS[r.fmt], used=Math.round((Math.min(Date.now(),r.endsAt)-r.startedAt)/60000);
    const rec={id:r.id,date:today(),fmt:r.fmt,scope:r.scope,items,sec,total,max:(r.qs.length-(r.bonus?12:0))*3,att,right,wrong:att-right,used,limit:F2.min,fresh:r.fresh,bonus:r.bonus};
    S.mockRuns=S.mockRuns||[]; S.mockRuns.unshift(rec);
    S.mocks.push({id:uid(),date:today(),name:`${F2.label} · SIM`,scores:{PHY:sec.PHY?sec.PHY.score:0,CHM:sec.CHM?sec.CHM.score:0,MAT:sec.MAT?sec.MAT.score:0,ENG:sec.ENG?sec.ENG.score:0,LR:sec.LR?sec.LR.score:0},
      total,max:rec.max,time:used,accuracy:att?right/att*100:0,errors:att-right,note:'Simulator run',sim:r.id});
    S.examRun=null; Engine.autoCheckin(); saveNow();
    CF.mockView=rec.id; go('bitsat/mocks'); toast(`SUBMITTED · ${total}/${rec.max}`,'s');
  },
  abandon(){ if(!confirm('Abandon this mock? Nothing is saved.')) return; S.examRun=null; saveNow(); go('bitsat/mocks'); },
  tick:null,
  paint(){ if(ROUTE.view==='bitsat'&&ROUTE.sub==='exam'){ const y=window.scrollY; $('#view').innerHTML=bitsatExam(); window.scrollTo(0,y); } },
};

/* ── analysis ─────────────────────────────────────────────────────── */
function mockAnalysis(rec){
  const prev=(S.mockRuns||[]).filter(x=>x.fmt===rec.fmt&&x.id!==rec.id&&x.date<=rec.date).slice(0,5);
  const secs=Object.entries(rec.sec), insights=[];
  const negLost=rec.wrong, idealPerQ=rec.limit*60/Math.max(1,rec.items.filter(x=>!x.bonus).length);
  secs.forEach(([k,s])=>{ const guess=s.att?s.wrong/s.att:0;
    if(s.att>=4&&guess>.35) insights.push({tone:'warn',t:`<b>${SECNAME[k]}</b>: ${Math.round(guess*100)}% of attempts were wrong — each costs 1 mark and 3 missed. Skipping them would have added <b>+${s.wrong}</b>.`}); });
  const timeShare=secs.map(([k,s])=>({k,share:s.time/Math.max(1,rec.items.reduce((a,x)=>a+x.t,0)),mark:s.n/Math.max(1,rec.items.length)}));
  timeShare.filter(x=>x.share-x.mark>.12).forEach(x=>insights.push({tone:'warn',t:`<b>${SECNAME[x.k]}</b> took ${Math.round(x.share*100)}% of your time for ${Math.round(x.mark*100)}% of the questions.`}));
  const sinks=rec.items.filter(x=>x.t>Math.max(2*(x.q.t||80),150)).sort((a,b)=>b.t-a.t);
  const sinkWrong=sinks.filter(x=>!x.ok);
  if(sinks.length) insights.push({tone:sinkWrong.length?'warn':'info',t:`${sinks.length} question${sinks.length>1?'s':''} took over twice their target time (${Math.round(sinks.reduce((a,x)=>a+x.t,0)/60)} min total)${sinkWrong.length?`, and ${sinkWrong.length} of those were still wrong or skipped`:''}.`});
  const easyLeft=rec.items.filter(x=>x.ch<0&&x.q.level==='SPEED');
  if(easyLeft.length>=3) insights.push({tone:'warn',t:`You left <b>${easyLeft.length} speed-level questions</b> unattempted — up to <b>${easyLeft.length*3} marks</b> that are usually quick.`});
  if(prev.length){ const p=prev[0]; const d=rec.total-p.total;
    const drivers=secs.map(([k,s])=>({k,d:s.score-((p.sec[k]||{}).score||0)})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).filter(x=>x.d).slice(0,2);
    insights.unshift({tone:d>=0?'good':'warn',t:`<b>${d>=0?'+':''}${d}</b> vs your last ${MOCK_FORMATS[rec.fmt].label.toLowerCase()} — mostly ${drivers.map(x=>`${SECNAME[x.k].toLowerCase()} ${x.d>0?'+':''}${x.d}`).join(', ')||'unchanged sections'}.`}); }
  const acc=rec.att?rec.right/rec.att*100:0;
  if(rec.att&&acc>=85&&rec.att/rec.items.length<.8) insights.push({tone:'info',t:`${Math.round(acc)}% accuracy on attempts but only ${Math.round(rec.att/rec.items.length*100)}% attempted — you can afford to attempt more.`});
  const byCh={}; rec.items.forEach(x=>{ const c=byCh[x.q.chapter]=byCh[x.q.chapter]||{n:0,right:0,att:0,sub:x.sec}; c.n++; if(x.ch>=0)c.att++; if(x.ok)c.right++; });
  const chRows=Object.entries(byCh).filter(([,c])=>c.n>=2).map(([k,c])=>({k,...c,acc:c.att?c.right/c.att*100:0})).sort((a,b)=>a.acc-b.acc);
  const byLv={}; rec.items.forEach(x=>{ const l=byLv[x.q.level]=byLv[x.q.level]||{n:0,att:0,right:0}; l.n++; if(x.ch>=0)l.att++; if(x.ok)l.right++; });
  const target=Number(S.mockTarget)||350, scaled=rec.fmt==='FULL'?rec.total:Math.round(rec.total/Math.max(1,rec.max)*390);
  return {prev,insights,chRows,byLv,acc,negLost,idealPerQ,sinks,target,scaled};
}
function mockReport(rec){
  const A=mockAnalysis(rec), F2=MOCK_FORMATS[rec.fmt];
  const wrong=rec.items.filter(x=>x.ch>=0&&!x.ok).length;
  const filt=CF.mockQ||'ALL';
  const items=rec.items.map((x,i)=>({...x,i})).filter(x=>filt==='ALL'||(filt==='WRONG'&&x.ch>=0&&!x.ok)||(filt==='SKIPPED'&&x.ch<0)||(filt==='MARKED'&&x.marked)||(filt==='SLOW'&&A.sinks.includes(rec.items[x.i])));
  return `
  <section class="pnl tk hero" style="margin-bottom:16px;overflow:hidden">${Art.block(rec.id,'spire','art-hero')}
    <div class="phd" style="position:relative"><span class="lbl-b">${F2.label} · ANALYSIS</span><span class="chip">${fmtDY(rec.date)}</span><span class="chip">${Math.round(rec.fresh/Math.max(1,rec.items.length)*100)}% FRESH QUESTIONS</span>
      <span class="sp"></span><button class="btn xs ghost" onclick="CF.mockView='';refresh()">ALL MOCKS</button></div>
    <div class="pbd" style="padding:34px 30px;position:relative">

const QImport={
  parse(text){
    const lines=String(text||'').replace(/\r/g,'').split('\n');
    const blocks=[]; let cur=[];
    const flush=()=>{ if(cur.join('').trim()) blocks.push(cur.join('\n')); cur=[]; };
    lines.forEach(l=>{ if(!l.trim()){ if(cur.some(x=>/^\s*(answer|ans)\b/i.test(x))) flush(); else cur.push(l); return; }
      if(/^\s*(q(uestion)?\s*)?\d{1,3}\s*[.):]\s+\S/i.test(l)&&cur.some(x=>/^\s*\(?[A-Da-d1-4][).]\s*/.test(x))) flush();
      cur.push(l); });
    flush();
    const out=[], bad=[];
    blocks.forEach((b,bi)=>{
      const optRe=/^\s*\(?([A-Da-d1-4])\s*[).:]\s*(.+)$/;
      const L=b.split('\n'); const qs=[], opts={}; let ans=null, sol=[], mode='q', last=null;
      L.forEach(l=>{ const t=l.trim(); if(!t) return;
        let m;
        if((m=t.match(/^(answer|ans|correct(\s+option)?)\s*[:\-–]?\s*\(?([A-Da-d1-4])\)?\b/i))){ ans=m[3]; mode='a'; return; }
        if((m=t.match(/^(solution|explanation|sol)\s*[:\-–]\s*(.*)$/i))){ mode='s'; if(m[2])sol.push(m[2]); return; }
        // a block's first line is always the question, even when it starts "1." or "2)"
        if(mode!=='s'&&qs.length&&(m=t.match(optRe))&&Object.keys(opts).length<4){ const k='ABCD'['ABCDabcd1234'.indexOf(m[1])%4]; if(!opts[k]){ opts[k]=m[2].trim(); last=k; mode='o'; return; } }
        if(mode==='s') sol.push(t); else if(mode==='o'&&last) opts[last]+=' '+t; else if(mode==='q') qs.push(t.replace(/^\s*(q(uestion)?\s*)?\d{1,3}\s*[.):]\s*/i,''));
      });
      const keys=['A','B','C','D'];
      if(!qs.length||keys.some(k=>!opts[k])||!ans){ bad.push(bi+1); return; }
      const a='ABCDabcd1234'.indexOf(ans)%4;
      out.push({q:qs.join(' '),opts:keys.map(k=>opts[k]),a,sol:sol.join(' ')});
    });
    return {out,bad};
  },
};

/* ═════════════════════════════════════════════════════════════════
   Part 19 · SYNC — your own Supabase project, your own login.
   One private row per account (row-level security). Every save is pushed
   a moment later; other devices pick it up within seconds.
   Merging is three-way against the last synced copy, item by item
   (by id, check-ins by date), so edits on two devices both survive.
   If the very same field was changed on both, the device syncing wins.
   ═════════════════════════════════════════════════════════════════ */
const SYNC_SQL=`create table if not exists public.lockin_state (
  user_id uuid primary key default auth.uid() references auth.users on delete cascade,
  doc jsonb not null,
  version bigint not null default 1,
  updated_at timestamptz not null default now()
);
alter table public.lockin_state enable row level security;
drop policy if exists "own row" on public.lockin_state;
create policy "own row" on public.lockin_state for all
  using (auth.uid() = user_id) with check (auth.uid() = user_id);`;

const Sync={
  K:KEY+'.sync', KB:KEY+'.syncbase',
  st:'off', err:'', busy:false, again:false, t:null, poll:null, lastOk:0, applying:false,
  cfg(){ try{ return JSON.parse(localStorage.getItem(Sync.K))||{}; }catch(e){ return {}; } },
  setCfg(patch){ const c=Object.assign(Sync.cfg(),patch); Object.keys(c).forEach(k=>c[k]===undefined&&delete c[k]);
    try{ localStorage.setItem(Sync.K,JSON.stringify(c)); }catch(e){} return c; },
  base(){ try{ return JSON.parse(localStorage.getItem(Sync.KB)); }catch(e){ return null; } },
  setBase(doc){ try{ localStorage.setItem(Sync.KB,JSON.stringify(doc)); }catch(e){} },
  ready(){ const c=Sync.cfg(); return !!(c.url&&c.key&&c.session); },

  /* ── merge ── */
  eq:(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b),
  isObj:x=>!!x&&typeof x==='object'&&!Array.isArray(x),
  keys(arr,path){ const n={};
    return arr.map(x=>{ let k;
      if(Sync.isObj(x)&&x.id!=null) k='#'+x.id;
      else if(Sync.isObj(x)&&/checkins$/.test(path)&&x.date) k='@'+x.date;
      else k='='+JSON.stringify(x);
      n[k]=(n[k]||0)+1; return n[k]>1?k+'~'+n[k]:k; }); },
  merge(b,l,r,path=''){
    if(Sync.eq(l,r)) return l;

    if(b!==undefined&&Sync.eq(r,b)) return l;
    if(Sync.isObj(l)&&Sync.isObj(r)){ const B=Sync.isObj(b)?b:{}, out={};
      new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
        const inL=k in l, inR=k in r, inB=k in B;
        if(inL&&inR) out[k]=Sync.merge(B[k],l[k],r[k],path+'.'+k);
        else if(inL){ if(!(inB&&Sync.eq(l[k],B[k]))) out[k]=l[k]; }        // removed remotely, untouched here → stays removed
        else { if(!(inB&&Sync.eq(r[k],B[k]))) out[k]=r[k]; } });

    if(Array.isArray(l)&&Array.isArray(r)){ const B=Array.isArray(b)?b:[];

      const order=kr.filter(keep);
      kl.forEach((k,i)=>{ if(mr.has(k)||!keep(k)) return; let j=i-1; while(j>=0&&!order.includes(kl[j])) j--;
        order.splice(j<0?0:order.indexOf(kl[j])+1,0,k); });
      return order.map(k=>ml.has(k)&&mr.has(k)?Sync.merge(mb.get(k),ml.get(k),mr.get(k),path+'[]'):(ml.has(k)?ml.get(k):mr.get(k))); }

  /* caches and per-device bits never leave the device */
  strip(s){ const o={}; Object.keys(s).forEach(k=>{ if(!/cache/i.test(k)) o[k]=s[k]; }); const d=JSON.parse(JSON.stringify(o));

  adopt(doc){ const local=S;

  statusLine(){ if(!Sync.ready()) return 'NOT CONNECTED';

/* ── MUSIC — the soundtrack ────────────────────────────────────────

   files you add here, which stay in this browser's IndexedDB (so they work on a
   phone too). The player lives outside the view, so it keeps going across pages. */
const Music={
  a:null, cur:null, order:[], urls:{}, folder:{}, failed:{}, base:MUSIC_DIR, lastSave:0, db:null,
  idb(){ return new Promise((res,rej)=>{ if(Music.db) return res(Music.db);
    const r=indexedDB.open(SHOTS_DB+'-music',1); r.onupgradeneeded=()=>r.result.createObjectStore('t');
    r.onsuccess=()=>{Music.db=r.result;res(r.result)}; r.onerror=()=>rej(r.error); }); },
  async put(k,v){ const db=await Music.idb(); return new Promise((res,rej)=>{ const tx=db.transaction('t','readwrite'); tx.objectStore('t').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async get(k){ const db=await Music.idb(); return new Promise(res=>{ const r=db.transaction('t').objectStore('t').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); },
  async del(k){ const db=await Music.idb(); return new Promise(res=>{ const tx=db.transaction('t','readwrite'); tx.objectStore('t').delete(k); tx.oncomplete=res; tx.onerror=res; }); },

  lib:()=>S.music.lib,
  track:id=>S.music.lib.find(t=>t.id===(id||Music.cur)),
  fmt:s=>{ s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },
  runtime(){ const s=S.music.lib.reduce((a,t)=>a+(t.d||0),0), h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h?`${h}H ${m}M`:`${m}M`; },
  seed(list){ list.forEach(([f,t,a,al,cv,d])=>{ const id='mz'+f.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,28);
    if(!S.music.lib.some(x=>x.id===id)) S.music.lib.push({id,t,a,al,cv,d,f,src:'dir',added:today()}); }); },

  audio(){ if(Music.a) return Music.a;
    const a=Music.a=new Audio(); a.preload='metadata'; a.volume=S.music.vol??.9;
    a.addEventListener('timeupdate',Music.tick);
    a.addEventListener('play',Music.paint); a.addEventListener('pause',Music.paint);
    a.addEventListener('ended',()=>{ const t=Music.track(); if(t){ S.music.plays[t.id]=(S.music.plays[t.id]||0)+1; save(); }
      if(S.music.repeat==='one'){ a.currentTime=0; a.play().catch(()=>{}); } else Music.next(true); });
    a.addEventListener('loadedmetadata',()=>{ const t=Music.track(); if(!t) return;

      if(Music.resumeAt){ a.currentTime=Math.min(Music.resumeAt,a.duration-1); Music.resumeAt=0; } });
    a.addEventListener('error',()=>{ const t=Music.track(); if(!t||!a.getAttribute('src')) return; Music.failed[t.id]=1; Music.paint();
      toast(t.src==='idb'?'THIS SONG’S FILE IS MISSING — ADD IT AGAIN':(location.protocol==='file:'?'SONG NOT FOUND IN THE MUSIC FOLDER':'OPEN THE LOCAL FILE COPY, OR LINK THE MUSIC FOLDER'),'r'); });
    if('mediaSession' in navigator){ const ms=navigator.mediaSession;
      [['play',()=>Music.toggle(true)],['pause',()=>Music.a.pause()],['previoustrack',()=>Music.prev()],['nexttrack',()=>Music.next()],
       ['seekto',d=>{ if(d.seekTime!=null) Music.a.currentTime=d.seekTime; }]].forEach(([k,f])=>{ try{ ms.setActionHandler(k,f); }catch(e){} }); }
    return a; },
  async src(t){
    if(Music.folder[t.f]) return Music.folder[t.f];
    if(t.src==='idb'){ if(!Music.urls[t.id]){ const b=await Music.get(t.id); if(!b) return null; Music.urls[t.id]=URL.createObjectURL(b); } return Music.urls[t.id]; }
    return Music.base?Music.base+encodeURIComponent(t.f):null; },
  cover(t){ if(!t||!t.cv) return '';
    if(t.cv==='idb') return Music.urls[t.id+':cv']||'';
    return Music.folder['.covers/'+t.cv]||(Music.base?Music.base+'.covers/'+encodeURIComponent(t.cv):''); },
  art(t,cls){ const u=Music.cover(t);
    return `<div class="mcv ${cls||''}" data-cv="${t?t.id:''}">${Art.block('mz-'+(t?t.id:'none'),'orbit')}${u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>`; },
  async hydrate(){ for(const t of S.music.lib) if(t.cv==='idb'&&!Music.urls[t.id+':cv']){ const b=await Music.get(t.id+':cv'); if(b) Music.urls[t.id+':cv']=URL.createObjectURL(b); }
    $$('.mcv[data-cv]').forEach(el=>{ const t=Music.track(el.dataset.cv), u=t&&Music.cover(t); if(u&&!el.querySelector('img')) el.insertAdjacentHTML('beforeend',`<img src="${esc(u)}" alt="">`); }); },

  seq(){ const ids=S.music.lib.map(t=>t.id); if(!S.music.shuffle) return ids;
    if(Music.order.length!==ids.length||ids.some(i=>!Music.order.includes(i))){
      const r=ids.filter(i=>i!==Music.cur); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }

let gKey=false;

  if(ROUTE.view==='bitsat'&&ROUTE.sub==='exam'&&S.examRun&&!typing&&!$('#modal').classList.contains('on')&&!$('#pal').classList.contains('on')&&!e.metaKey&&!e.ctrlKey){
    const k=e.key.toLowerCase(), map={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};
    if(k in map){e.preventDefault();Mock.answer(map[k]);return}
    if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();Mock.next();return}
    if(e.key==='ArrowLeft'){e.preventDefault();Mock.go(S.examRun.cur-1);return}
    if(k==='m'){e.preventDefault();Mock.mark();return}
    if(e.key==='Backspace'){e.preventDefault();Mock.clear();return}
  }
  if(e.key==='Escape'){ if($('#pal').classList.contains('on'))Pal.close(); else if($('#modal').classList.contains('on'))closeModal(); return }
  if($('#pal').classList.contains('on')){
    if(e.key==='ArrowDown'){e.preventDefault();Pal.idx=clamp(Pal.idx+1,0,Pal.list.length-1);Pal.render($('#palq').value)}
    if(e.key==='ArrowUp'){e.preventDefault();Pal.idx=clamp(Pal.idx-1,0,Pal.list.length-1);Pal.render($('#palq').value)}
    if(e.key==='Enter'){e.preventDefault();Pal.run(Pal.idx)}
    return;
  }
  if(typing)return;
  const k=e.key.toLowerCase();
  if(gKey){ gKey=false;
    const map=['command','goals','bitsat','college','tasks','habits','body','capital','build','log'];
    if(/^[0-9]$/.test(k)){go(map[+k]);return}
  }
  if(k==='g'){gKey=true;setTimeout(()=>gKey=false,900);return}
  if(k==='n'){const n=Engine.next();if(n){Engine.start(n.id);refresh()}}
  if(k==='c'){UI.checkinModal()}
  if(k==='/'){e.preventDefault();Pal.open()}
});
$('#palq').addEventListener('input',e=>{Pal.idx=0;Pal.render(e.target.value)});

let rzT=null;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(ROUTE.view==='habits')refresh()},250)});

/* boot */
load();
document.documentElement.setAttribute('data-theme',THEMES.includes(S.prefs.theme)?S.prefs.theme:'blue');
if(!location.hash) location.hash='#/'+(S.prefs.lastView||'command');
router();
requestAnimationFrame(()=>{const d=document.getElementById('navdot');if(d)d.style.transition='none';syncNavDot();
  requestAnimationFrame(()=>{if(d)d.style.transition='';});});
setInterval(renderStrip,60000);
if(!S.seen.boot) setTimeout(UI.onboard,420);

</script>
